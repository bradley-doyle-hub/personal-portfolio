<footer class="footer">
  <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  <span class="footer__social">
    {% assign socials = site.social | where_exp: "s", "s.url != ''" %}
    {% for s in socials %}<a href="{{ s.url }}" rel="me noopener" target="_blank">{{ s.label }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
  </span>
  <span>&copy; {{ site.time | date: "%Y" }} · {{ site.location }}</span>
</footer>
