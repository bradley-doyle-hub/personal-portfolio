{% if site.basin_endpoint != "" %}
<form class="contact-form" action="{{ site.basin_endpoint }}" method="POST">
  <div class="field">
    <label for="cf-name">Name</label>
    <input id="cf-name" name="name" type="text" autocomplete="name" required>
  </div>
  <div class="field">
    <label for="cf-email">Email</label>
    <input id="cf-email" name="email" type="email" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="cf-message">Project details</label>
    <textarea id="cf-message" name="message" rows="5" required></textarea>
  </div>
  <!-- Basin honeypot. Leave empty. -->
  <input type="text" name="_gotcha" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit" class="button">Send</button>
</form>
{% else %}
<p class="contact-form--pending">Form coming soon. For now, email <a href="mailto:{{ site.email }}">{{ site.email }}</a>.</p>
{% endif %}
