{% if site.basin_endpoint != "" %}
<form class="contact-form" action="{{ site.basin_endpoint }}" method="POST">
  <label class="field">
    <span class="field__label">name</span>
    <input name="name" type="text" autocomplete="name" placeholder="jane smith" required>
  </label>
  <label class="field">
    <span class="field__label">email</span>
    <input name="email" type="email" autocomplete="email" placeholder="jane@studio.com" required>
  </label>
  <label class="field">
    <span class="field__label">message</span>
    <textarea name="message" rows="4" placeholder="tell me about the project…" required></textarea>
  </label>
  <!-- Basin honeypot. Leave empty. -->
  <input type="text" name="_gotcha" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div><button type="submit" class="btn btn--primary">send message →</button></div>
</form>
{% endif %}
